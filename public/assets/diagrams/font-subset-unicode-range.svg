<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box-origin { fill: #fff1f2; stroke: #f43f5e; stroke-width: 1.8; rx: 8; }
      .box-slice { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6; }
      .box-loaded { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; rx: 6; }
      .box-browser { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.8; rx: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12.5px; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#ft-arrow); fill: none; }
      .arrow-hit { stroke: #2563eb; stroke-width: 2; marker-end: url(#hit-arrow); fill: none; }
    </style>
    <marker id="ft-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="hit-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="820" height="400" rx="10" class="bg" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="32" y="34" class="title">Web 中文字体优化 · 基于 CSS unicode-range 的动态切片分包模型</text>
  <text x="32" y="54" class="desc">将 15MB 庞大中文字库按使用字频切片为 100 个微型分包，浏览器按需拉取，首屏只需 150KB。</text>

  <!-- 左侧：未优化的庞大母字体 (15MB ~ 25MB) -->
  <g transform="translate(32, 85)">
    <rect width="200" height="280" class="box-origin" />
    <text x="18" y="32" font-size="14" font-weight="700" fill="#be123c">📦 原始完整母字体</text>
    <text x="18" y="52" font-size="11" fill="#9f1239">OTF / TTF (GB18030)</text>

    <rect x="14" y="70" width="172" height="110" rx="4" fill="#ffffff" stroke="#fecaca" />
    <text x="24" y="96" font-size="28" font-weight="800" fill="#e11d48">18.5 MB</text>
    <text x="24" y="120" font-size="11" fill="#475569">包含 20,902+ 汉字</text>
    <text x="24" y="138" font-size="11" fill="#475569">95% 为罕见字/生僻字</text>
    <text x="24" y="158" font-size="11" font-weight="600" fill="#e11d48">移动端加载产生数秒白屏！</text>

    <rect x="14" y="196" width="172" height="66" rx="4" fill="#fee2e2" />
    <text x="22" y="218" font-size="10.5" font-weight="700" fill="#991b1b">传统全量加载弊端：</text>
    <text x="22" y="234" font-size="9.5" fill="#7f1d1d">• FOIT 闪烁与严重卡顿</text>
    <text x="22" y="248" font-size="9.5" fill="#7f1d1d">• 浪费用户数十兆流量</text>
  </g>

  <!-- 中间：cn-font-split 工具切片分包池 -->
  <g transform="translate(275, 85)">
    <rect width="270" height="280" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="18" y="32" font-size="14" font-weight="700" fill="#0f172a">🧩 动态切片字库池 (CDN 托管)</text>
    <text x="18" y="52" font-size="11" fill="#64748b">按现代汉字使用频次拆为 ~100 个切片</text>

    <!-- 切片 001 (命中) -->
    <g transform="translate(14, 68)">
      <rect width="242" height="54" class="box-loaded" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#1d4ed8">切片 001 (最常用 300 汉字 + 标点)</text>
      <text x="12" y="34" font-family="monospace" font-size="9.5" fill="#2563eb">unicode-range: U+4E00-4E2F, U+3000-303F</text>
      <text x="12" y="47" font-size="10" font-weight="600" fill="#15803d">⚡ 首屏 100% 命中 · 仅 65 KB (WOFF2)</text>
    </g>

    <!-- 切片 002 (命中) -->
    <g transform="translate(14, 130)">
      <rect width="242" height="54" class="box-loaded" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#1d4ed8">切片 002 (次高频 500 汉字)</text>
      <text x="12" y="34" font-family="monospace" font-size="9.5" fill="#2563eb">unicode-range: U+4E30-4E6F...</text>
      <text x="12" y="47" font-size="10" font-weight="600" fill="#15803d">⚡ 首屏命中 · 仅 72 KB (WOFF2)</text>
    </g>

    <!-- 切片 003~100 (未出现，不下载) -->
    <g transform="translate(14, 192)">
      <rect width="242" height="70" class="box-slice" stroke-dasharray="4,4" />
      <text x="12" y="22" font-size="11" font-weight="600" fill="#64748b">切片 003 ~ 切片 100 (低频与生僻字)</text>
      <text x="12" y="38" font-family="monospace" font-size="9.5" fill="#94a3b8">unicode-range: U+8000-9FFF...</text>
      <text x="12" y="56" font-size="10" font-weight="700" fill="#64748b">💤 页面未包含对应字符时，浏览器完全不发起请求！</text>
    </g>
  </g>

  <!-- 右侧：浏览器按需感知拉取 -->
  <g transform="translate(585, 85)">
    <rect width="205" height="280" class="box-browser" />
    <text x="18" y="32" font-size="14" font-weight="700" fill="#166534">🌐 客户端浏览器</text>
    <text x="18" y="52" font-size="11" fill="#15803d">DOM 树解析与文本扫描</text>

    <rect x="14" y="70" width="177" height="84" rx="4" fill="#ffffff" stroke="#86efac" />
    <text x="12" y="22" font-size="11" font-weight="700" fill="#166534">① 扫描页面出现汉字</text>
    <text x="12" y="40" font-size="10" fill="#475569">“知识库与排版工程”</text>
    <text x="12" y="58" font-size="10" fill="#475569">计算字符所在的 Unicode 范围</text>
    <text x="12" y="74" font-size="10.5" font-weight="600" fill="#2563eb">仅匹配切片 001 与 002</text>

    <rect x="14" y="168" width="177" height="92" rx="4" fill="#dcfce7" />
    <text x="12" y="24" font-size="11.5" font-weight="800" fill="#166534">② 瞬间秒级渲染</text>
    <text x="12" y="44" font-size="10.5" fill="#15803d">总加载体积：<tspan font-weight="700">仅 137 KB</tspan></text>
    <text x="12" y="62" font-size="10.5" fill="#15803d">下载耗时：<tspan font-weight="700">&lt; 150 毫秒</tspan></text>
    <text x="12" y="80" font-size="10.5" font-weight="700" fill="#166534">既获高颜值，又享极致秒开</text>
  </g>

  <!-- 连线 -->
  <path d="M 232 225 L 275 225" class="arrow" />
  <path d="M 545 140 L 585 140" class="arrow-hit" />
</svg>

name: Agent launcher Windows smoke

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/agent-launch.mjs
      - test/agent_launch.test.mjs
      - scripts/agent-sync.mjs
      - test/agent_cli_entry.test.mjs
      - test/branch_ruleset.test.mjs
      - .github/workflows/agent-launch-windows.yml

permissions:
  contents: read

jobs:
  windows-launch:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Native executable and blocking logic
        run: node --test test/agent_launch.test.mjs test/agent_cli_entry.test.mjs test/branch_ruleset.test.mjs
